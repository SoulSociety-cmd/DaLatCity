<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đồng Nai Landing</title>

<!-- Swiper + AOS -->
<link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#FFF7EA;
}

/* HERO */
.hero{
  padding:60px 20px;
  text-align:center;
}
.hero h1{
  font-size:40px;
  color:#0E4D3A;
}
.hero p{
  color:#444;
}

/* CARD */
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* ATTRACTIONS */
.attractions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:40px;
}

.attraction{
  overflow:hidden;
  border-radius:16px;
  background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.attraction img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.attraction .content{
  padding:15px;
}

/* SWIPER */
.swiper{
  width:90%;
  margin:auto;
  padding:40px 0;
}
.swiper-slide{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
  background:#0E4D3A;
  color:#fff;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1 data-aos="fade-up">Khám phá Đồng Nai</h1>
  <p data-aos="fade-up" data-aos-delay="200">
    Du lịch, ẩm thực và phát triển công nghiệp
  </p>
</section>

<!-- ATTRACTIONS -->
<section class="attractions">

  <div class="attraction" data-aos="fade-up">
    <img src="https://images.unsplash.com/photo-1596436889106-be35e843f974" alt="">
    <div class="content">
      <h3>Vườn quốc gia Cát Tiên</h3>
      <p>Thiên nhiên hoang sơ, đa dạng sinh học.</p>
    </div>
  </div>

  <div class="attraction" data-aos="fade-up" data-aos-delay="100">
    <img src="https://images.unsplash.com/photo-1586500036706-41963de24d8b" alt="">
    <div class="content">
      <h3>KDL Bửu Long</h3>
      <p>“Hạ Long thu nhỏ” của Đồng Nai.</p>
    </div>
  </div>

  <div class="attraction" data-aos="fade-up" data-aos-delay="200">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="">
    <div class="content">
      <h3>Văn Miếu Trấn Biên</h3>
      <p>Di tích văn hóa lâu đời.</p>
    </div>
  </div>

</section>

<!-- SWIPER GALLERY -->
<div class="swiper mySwiper">
  <div class="swiper-wrapper">

    <div class="swiper-slide">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
    </div>

    <div class="swiper-slide">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
    </div>

    <div class="swiper-slide">
      <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d">
    </div>

  </div>

  <div class="swiper-pagination"></div>
</div>

<!-- FOOTER -->
<footer class="footer">
  © 2026 Đồng Nai Landing
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<script>
AOS.init();

// Swiper
new Swiper(".mySwiper", {
  loop:true,
  autoplay:{ delay:3000 },
  pagination:{ el:".swiper-pagination" }
});

// GSAP simple animation
gsap.from(".hero h1", {y:50, opacity:0, duration:1});
</script>

</body>
</html>
